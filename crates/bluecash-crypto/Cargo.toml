[package]
name = "bluecash-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Shared cryptographic core for the BlueCash Protocol (Person A)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
# `bluecash_crypto` is the Python import name; cdylib produces the extension
# module, rlib keeps the crate usable as a normal Rust dependency.
name = "bluecash_crypto"
crate-type = ["cdylib", "rlib"]

[features]
# PyO3 is opt-in so `cargo test`/`clippy` build and link without a Python
# interpreter. maturin turns it on via [tool.maturin] features in pyproject.toml.
python = ["dep:pyo3"]
# UniFFI scaffolding for the Android client. Opt-in for the same reason: the
# default build, the tests and clippy must not depend on it.
uniffi-bindings = ["dep:uniffi"]

[dependencies]
# Python bindings, optional — see the `python` feature above.
pyo3 = { version = "0.29.3", features = [
    "extension-module",
    "num-bigint",
], optional = true }
# SHA-256 for the full-domain hash and the Merkle tree.
sha2 = "0.10.9"
# Arbitrary-precision integers: the `mod n` reduction in the FDH, the RSA blind
# signature arithmetic, and the 2048-bit prime-field share scheme.
num-bigint = "0.4.8"
# Needed for `modinverse` (unblinding) and `gcd` (blinding-factor selection).
num-integer = "0.1.47"
num-traits = "0.2.19"
# Ed25519 (RFC 8032) — matches the BouncyCastle Ed25519Signer used by the client.
ed25519-dalek = "2.2.0"
# OS randomness only; no `rand` dependency, to keep the offline tree minimal.
getrandom = "0.2.17"
# Kotlin/Swift bindings, optional — see the `uniffi-bindings` feature above.
# `cli` provides the bindgen entry point used by the `uniffi-bindgen` binary.
uniffi = { version = "0.32.2", features = ["cli"], optional = true }
# Session setup for the BLE channel, matching the Android client. The 0.10/0.12
# generation is deliberate: it shares one `digest` version with sha2 0.10.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hmac = "0.12.1"
aes-gcm = "0.10.3"
# Wipes session and ephemeral keys on drop. Already in the tree via the dalek
# crates; named here because this crate uses it directly.
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
# Decoding the hex test vectors generated from the reference server.
hex = "0.4.3"

# The bindings generator, run as `cargo run --features uniffi-bindings
# --bin uniffi-bindgen`. A binary in this crate rather than a separately
# installed tool, so the generator version can never drift from the
# scaffolding version compiled into the library.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi-bindings"]

[lints.rust]
missing_docs = "warn"
